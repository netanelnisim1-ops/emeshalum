name: Daily Blog Article

# Triggered daily via Vercel Cron (workflow_dispatch from /api/cron/daily-article)
# Vercel cron is more reliable than GitHub Actions schedule.
# Can also be triggered manually from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "Optional specific keyword (otherwise picked automatically)"
        required: false
        type: string
      dry_run:
        description: "Test run without writing article file"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INPUT_KEYWORD: ${{ inputs.keyword }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INPUT_KEYWORD" ]; then
            ARGS="--keyword \"$INPUT_KEYWORD\""
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval node scripts/generate-article.mjs $ARGS

      - name: Configure Git
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Emesh Aluminum Bot"
          git config user.email "bot@emeshalum.co.il"

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          git add content/blog/*.md content/blog-state.json
          if git diff --staged --quiet; then
            echo "No changes to push"
          else
            DATE=$(date +"%Y-%m-%d")
            git commit -m "chore(blog): daily article - $DATE"
            git push origin main
          fi
