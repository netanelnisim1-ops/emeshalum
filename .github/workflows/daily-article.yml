name: Daily Blog Article

# רץ אוטומטית כל יום ב-06:00 בבוקר שעון ישראל (03:00 UTC בקיץ, 04:00 UTC בחורף)
# בנוסף ניתן להריץ ידנית מטאב Actions ב-GitHub

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC = 06:00/07:00 IST
  workflow_dispatch:
    inputs:
      keyword:
        description: 'מילת מפתח ספציפית (אופציונלי - אחרת ייבחר אוטומטית)'
        required: false
      dry_run:
        description: 'הרצה ניסיונית בלי לכתוב קובץ'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate article
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.keyword }}" ]; then
            ARGS="$ARGS --keyword \"${{ github.event.inputs.keyword }}\""
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval node scripts/generate-article.mjs $ARGS

      - name: Configure Git
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "א.מ.ש אלומיניום Bot"
          git config user.email "bot@emeshalum.co.il"

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git add content/blog/*.md content/blog-state.json
          if git diff --staged --quiet; then
            echo "אין שינויים לדחיפה"
          else
            DATE=$(date +"%Y-%m-%d")
            git commit -m "מאמר יומי אוטומטי - $DATE

Generated by daily article workflow
🤖 Auto-generated content via Claude"
            git push origin main
          fi
